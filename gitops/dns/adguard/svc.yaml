apiVersion: v1
kind: Service
metadata:
  name: adguard
  namespace: dns
spec:
  type: LoadBalancer
  externalIPs:
  - 100.78.208.9
  selector:
    app: adguard
  ports:
    - name: dns-tcp
      port: 53
      targetPort: 53
      protocol: TCP
    - name: dns-udp
      port: 53
      targetPort: 53
      protocol: UDP
