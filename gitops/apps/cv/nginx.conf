server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; object-src 'self'; frame-src 'self'; base-uri 'none'; form-action 'none'" always;

    location = /healthz {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    location = /download {
        alias /usr/share/nginx/html/omer-levy-cv.pdf;
        default_type application/pdf;
        add_header Content-Disposition 'attachment; filename="Omer-Levy-CV.pdf"';
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.pdf$ {
        add_header Cache-Control "public, max-age=3600";
    }
}
